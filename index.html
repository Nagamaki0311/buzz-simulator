<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>ドーパミン大放出！バズシミュレーター</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-theme="light">

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="header-side"></div>
    <div class="brand-mark" aria-label="Buzz Simulator">B</div>
    <div class="header-actions">
      <button id="sound-toggle" class="icon-btn" title="通知音のON/OFF">🔊</button>
      <button id="theme-toggle" class="icon-btn" title="ダーク/ライト切替">🌙</button>
    </div>
  </header>

  <!-- 進行度バー（シミュレーション中のみ意味を持つが、常設で残す） -->
  <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>

  <!-- ホーム画面 -->
  <section id="screen-home" class="screen">
    <div id="pull-indicator" class="pull-indicator"><div class="pull-spinner"></div></div>

    <div id="composer" class="composer">
      <textarea id="post-input" maxlength="40" placeholder="いまどうしてる？"></textarea>
      <div class="composer-footer">
        <span class="char-count" id="char-count">0/40</span>
        <button id="post-btn" class="post-btn" disabled>投稿する</button>
      </div>
    </div>

    <div id="my-post" class="my-post" style="display:none;">
      <div class="post-card">
        <div class="avatar" id="my-avatar" style="background:#1d9bf0;">🙂</div>
        <div class="post-body">
          <div class="post-name-row">
            <span class="post-name">あなた</span>
            <span class="post-handle">@you</span>
          </div>
          <div class="post-text" id="my-post-text"></div>
          <div class="post-stats">
            <div class="stat reply"><span>💬</span><span class="num" id="stat-reply">0</span></div>
            <div class="stat repost"><span>🔁</span><span class="num" id="stat-repost">0</span></div>
            <div class="stat like"><span>❤️</span><span class="num" id="stat-like">0</span></div>
          </div>
        </div>
      </div>
    </div>

    <div id="home-quotes" class="home-quotes hidden">
      <div class="home-quotes-title">引用ポスト</div>
      <div id="home-quotes-list"></div>
    </div>
  </section>

  <!-- 通知画面 -->
  <section id="screen-notifications" class="screen hidden">
    <div id="notif-list"></div>
    <div id="notif-empty" class="empty-state">まだ通知はありません</div>
  </section>

  <!-- DM画面 -->
  <section id="screen-dm" class="screen hidden">
    <div id="dm-list"></div>
    <div id="dm-empty" class="empty-state">まだメッセージはありません</div>
  </section>

  <!-- リザルト画面 -->
  <section id="screen-result" class="screen hidden">
    <div class="result-wrap">
      <div style="font-size:13px;color:var(--text-sub);">今回のバズ結果</div>
      <div id="result-rank" class="result-rank">S</div>
      <div class="result-sub" id="result-sub">お疲れさまでした</div>

      <div class="result-grid">
        <div class="result-card"><div class="label">表示回数</div><div class="value" id="r-impressions">0</div></div>
        <div class="result-card"><div class="label">総いいね</div><div class="value" id="r-likes">0</div></div>
        <div class="result-card"><div class="label">総リポスト</div><div class="value" id="r-reposts">0</div></div>
        <div class="result-card"><div class="label">総返信</div><div class="value" id="r-replies">0</div></div>
        <div class="result-card"><div class="label">総DM</div><div class="value" id="r-dms">0</div></div>
        <div class="result-card"><div class="label">通知総数</div><div class="value" id="r-total">0</div></div>
        <div class="result-card"><div class="label">ピーク通知速度</div><div class="value" id="r-peak">0/秒</div></div>
        <div class="result-card"><div class="label">推定トレンド順位</div><div class="value" id="r-trend">-</div></div>
      </div>

      <div class="result-note">
        <div class="row"><span>最も多かった返信タイプ</span><span id="r-top-reply">-</span></div>
        <div class="row"><span>最も多かったDMカテゴリ</span><span id="r-top-dm">-</span></div>
      </div>

      <button id="restart-btn" class="primary-btn">もう一度あそぶ</button>
    </div>
  </section>

  <!-- タブバー -->
  <nav id="tabbar" class="tabbar">
    <button class="tab active" data-tab="home">
      <span class="tab-icon-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 11 12 4l8.5 7"/>
          <path d="M5.5 9.8V19a1 1 0 0 0 1 1h4v-6h3v6h4a1 1 0 0 0 1-1V9.8"/>
        </svg>
      </span>
      <span class="tab-label">ホーム</span>
    </button>
    <button class="tab" data-tab="notifications">
      <span class="tab-icon-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 8.5a5.5 5.5 0 0 1 11 0c0 4.2 1.4 5.6 1.9 6.6a.6.6 0 0 1-.5.9H5.1a.6.6 0 0 1-.5-.9c.5-1 1.9-2.4 1.9-6.6Z"/>
          <path d="M10.2 19a1.9 1.9 0 0 0 3.6 0"/>
        </svg>
        <span class="badge" id="badge-notif">0</span>
      </span>
      <span class="tab-label">通知</span>
    </button>
    <button class="tab" data-tab="dm">
      <span class="tab-icon-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="5.5" width="17" height="13" rx="2.2"/>
          <path d="M4.3 7 12 12.5 19.7 7"/>
        </svg>
        <span class="badge" id="badge-dm">0</span>
      </span>
      <span class="tab-label">DM</span>
    </button>
  </nav>

  <!-- スタート案内オーバーレイ -->
  <div id="start-overlay" class="overlay">
    <div class="overlay-mark">B</div>
    <div class="breathe-text-wrap">
      <div class="breathe-text" id="breathe-1">バズの通知に埋もれる</div>
      <div class="breathe-text" id="breathe-2">まずは何かポストしてみましょう</div>
    </div>
    <button id="overlay-start-btn" class="primary-btn">はじめる</button>
  </div>

</div>

<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
